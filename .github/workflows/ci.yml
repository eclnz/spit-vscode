name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out extension
        uses: actions/checkout@v7
        with:
          path: spit-vscode
          persist-credentials: false

      # SPIT's work merges into dev. A change made in both repositories
      # has one branch name in each, so a branch that SPIT also has builds
      # SPIT's branch instead, and the two are tested together.
      - name: Choose SPIT's branch
        id: spit
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref=dev
          if [ "$BRANCH" != main ] && [ "$BRANCH" != dev ] &&
              git ls-remote --exit-code --heads https://github.com/eclnz/spit "refs/heads/$BRANCH" > /dev/null; then
            ref=$BRANCH
          fi
          echo "Building SPIT from $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out SPIT compiler
        uses: actions/checkout@v7
        with:
          repository: eclnz/spit
          ref: ${{ steps.spit.outputs.ref }}
          path: spit
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: spit-vscode/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build SPIT compiler
        working-directory: spit
        run: cargo build --locked

      - name: Install extension dependencies
        working-directory: spit-vscode
        run: npm ci

      - name: Run extension tests
        working-directory: spit-vscode
        run: |
          test -x ../spit/target/debug/spit
          npm test
